name: CI_build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup LLVM-MinGW Toolchain
      shell: pwsh
      run: |
        $cachedZip = "$env:TEMP\llvm-mingw.zip"
        $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-x86_64.zip"
        Write-Host "Downloading LLVM-MinGW toolchain..." -ForegroundColor Cyan
        Invoke-WebRequest -Uri $url -OutFile $cachedZip
        Expand-Archive -Path $cachedZip -DestinationPath "C:\llvm-mingw"
        $llvmBin = (Get-ChildItem -Path "C:\llvm-mingw" -Directory | Select-Object -First 1).FullName + "\bin"
        echo "$llvmBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Build plugin DLLs (x64 and x86) and run tests
      shell: pwsh
      run: |
        ./build.ps1
        ./makerelease.ps1

    - name: Archive artifacts x86
      uses: actions/upload-artifact@v4
      with:
        name: NppMarkdownPanel_win32
        path: Release/*-x86.zip

    - name: Archive artifacts x64
      uses: actions/upload-artifact@v4
      with:
        name: NppMarkdownPanel_x64
        path: Release/*-x64.zip

    - name: Release on GitHub
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: Release/*.zip
        generate_release_notes: true
