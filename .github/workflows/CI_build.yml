name: CI_build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Cache LLVM-MinGW Toolchain
      id: cache-llvm
      uses: actions/cache@v6
      with:
        path: C:\llvm-mingw
        key: llvm-mingw-20260908-ucrt-x86_64

    - name: Setup LLVM-MinGW Toolchain
      shell: pwsh
      run: |
        if (-not (Test-Path "C:\llvm-mingw\llvm-mingw-20260908-ucrt-x86_64\bin\clang++.exe")) {
          $cachedZip = "$env:TEMP\llvm-mingw.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/llvm-mingw-20260908-ucrt-x86_64.zip"
          Write-Host "Downloading LLVM-MinGW 20260908 toolchain..." -ForegroundColor Cyan
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13
          Invoke-WebRequest -Uri $url -OutFile $cachedZip -UseBasicParsing
          Expand-Archive -Path $cachedZip -DestinationPath "C:\llvm-mingw" -Force
          Remove-Item $cachedZip -Force -ErrorAction SilentlyContinue
        }
        $llvmBin = (Get-ChildItem -Path "C:\llvm-mingw" -Directory | Select-Object -First 1).FullName + "\bin"
        Write-Host "Adding $llvmBin to PATH" -ForegroundColor Green
        echo "$llvmBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Cache WebView2 NuGet Package
      uses: actions/cache@v6
      with:
        path: packages/Microsoft.Web.WebView2.1.0.4191.47
        key: webview2-nuget-1.0.4191.47

    - name: Build plugin DLLs (x64 and x86) and run tests
      shell: pwsh
      run: |
        ./build.ps1
        ./makerelease.ps1

    - name: Archive artifacts x86
      uses: actions/upload-artifact@v7
      with:
        name: NppMarkdownPanel_win32
        path: Release/*-x86.zip

    - name: Archive artifacts x64
      uses: actions/upload-artifact@v7
      with:
        name: NppMarkdownPanel_x64
        path: Release/*-x64.zip

    - name: Release on GitHub
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: Release/*.zip
        generate_release_notes: true
